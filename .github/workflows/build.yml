name: Build Docker image

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build image
        run: docker build -t devops-flask:ci .
      - name: Smoke-test /health
        run: |
          docker run --detach --name devops-flask-ci -p 127.0.0.1:5000:5000 devops-flask:ci
          body_file="$RUNNER_TEMP/devops-flask-health.json"
          status=$(curl --silent --show-error --fail \
            --retry 5 --retry-connrefused --retry-delay 1 --max-time 3 \
            --output "$body_file" --write-out '%{http_code}' \
            http://127.0.0.1:5000/health)
          printf 'Health check returned HTTP %s\n' "$status"
          cat "$body_file"
          test "$status" = 200
          python3 -c 'import json, sys; sys.exit(json.load(sys.stdin).get("status") != "ok")' < "$body_file"
          test "$(docker exec devops-flask-ci id -u)" -ne 0
      - name: Show logs and remove test container
        if: always()
        run: |
          if docker container inspect devops-flask-ci >/dev/null 2>&1; then
            docker logs devops-flask-ci || true
            docker rm --force devops-flask-ci
          fi
